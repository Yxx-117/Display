<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>团队知识库</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="团队内部 Docsify 知识库">

  <!--
    CDN 说明（国内访问重点关注）：
    1. 默认使用 npmmirror，原 jsdelivr 在中国大陆访问不稳定
    2. URL 规则：https://registry.npmmirror.com/<包名>/<大版本号>/files/<包内路径>
       只写大版本号即可自动取该大版本下的最新小版本，无需手工追版本
    3. 若需要彻底摆脱 CDN，执行：python tools/fetch_vendor.py
       脚本会把本文件引用的外部资源下载到 docsify_root/vendor/ 并自动改写引用
    4. 可选增强插件见文件末尾注释，按需取消注释即可
  -->
  <!-- 主题说明：vue.css / buble.css 内含 @import fonts.googleapis.com，
       国内访问会明显拖慢首屏，因此这里使用无外链依赖的 pure.css，
       主题色在下方 :root 中覆盖 -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://registry.npmmirror.com/docsify/4/files/lib/themes/pure.css">
  <link rel="stylesheet" href="https://registry.npmmirror.com/docsify-plugin-toc/1.3.1/files/dist/light.css">

  <style>
    :root {
      --theme-color: #2563eb;
    }

    .app-name-link,
    .sidebar-nav a,
    .markdown-section a {
      font-weight: 500;
    }

    .markdown-section {
      max-width: 960px;
    }

    .page_toc {
      max-height: calc(100vh - 120px);
      overflow: auto;
    }

    .cover-main > p:last-child a {
      background-color: var(--theme-color);
      border-color: var(--theme-color);
    }
  </style>
</head>
<body>
  <div id="app">文档加载中…</div>

  <script>
    window.$docsify = {
      name: '团队知识库',
      repo: '',
      homepage: 'README.md',
      coverpage: true,
      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      notFoundPage: true,
      // 让任意层级页面都能正确定位到根目录下的导航文件
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_coverpage.md': '/_coverpage.md',
        '/.*/README.md': '/README.md'
      },
      toc: {
        tocMaxLevel: 4,
        target: 'h2, h3, h4, h5'
      },
      search: {
        placeholder: '搜索知识库内容',
        noData: '未找到相关内容',
        depth: 4,
        hideOtherSidebarContent: false
      }
    }
  </script>

  <script src="https://registry.npmmirror.com/docsify/4/files/lib/docsify.min.js"></script>
  <script src="https://registry.npmmirror.com/docsify/4/files/lib/plugins/search.min.js"></script>
  <script src="https://registry.npmmirror.com/docsify-plugin-toc/1.3.1/files/dist/docsify-plugin-toc.min.js"></script>

  <!-- 可选增强：分页导航 -->
  <!-- <script src="https://registry.npmmirror.com/docsify-pagination/2/files/dist/docsify-pagination.min.js"></script> -->

  <!-- 可选增强：代码块一键复制（启用后需在上面 window.$docsify 中加 plugin 配置） -->
  <!-- <script src="https://registry.npmmirror.com/docsify-copy-code/2/files/dist/docsify-copy-code.min.js"></script> -->

  <!-- 可选增强：代码高亮（按需替换为需要的语言包） -->
  <!-- <script src="https://registry.npmmirror.com/prismjs/1/files/components/prism-bash.min.js"></script> -->

</body>
</html>
